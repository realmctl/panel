# Local nginx config for panel.realmctl.com (via Cloudflare tunnel)
# Start: make nginx-dev  (or see Makefile)

worker_processes 1;

events {
    worker_connections 256;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 127.0.0.1:8000;
        server_name panel.realmctl.com;
        root /Users/stijnjakobs/Downloads/realmctl/panel/public;
        index index.php;

        client_max_body_size 100m;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include /opt/homebrew/etc/nginx/fastcgi_params;
        }
    }
}
